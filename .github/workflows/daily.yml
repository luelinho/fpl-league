name: Daily FPL sync

on:
  schedule:
    # Shortly after 06:00 UTC, per SPEC.md §6 — after the previous day's
    # matches have settled, before most European price changes land.
    - cron: "5 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily sync and rebuild derived outputs
        run: |
          python -m src.daily_sync
          python -m src.calculate
          python -m src.recap
          python -m src.digest
          python -m src.build_dashboard

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet -- db/league.sqlite digest/season.json dashboard.html reports/; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git config user.name "fpl-league-bot"
          git config user.email "actions@users.noreply.github.com"
          git add db/league.sqlite digest/season.json dashboard.html reports/
          git commit -m "Daily sync $(date -u +%Y-%m-%d)"
          # Someone/something else may have pushed to main since this job
          # checked out (a manual run overlapping the schedule, or a
          # manual push) — rebase onto the latest and retry rather than
          # failing the whole run over a plain race condition.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — pulling latest and retrying..."
            git pull --rebase origin main
            sleep 5
          done
          echo "::error::Could not push after 5 attempts."
          exit 1
